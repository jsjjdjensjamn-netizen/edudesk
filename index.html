<style>
:root{--bg:#f2f8f7;--card:#fff;--ink:#10231f;--mut:#5a6f6b;--pri:#0f766e;--pri2:#14a38f;--acc:#ffb020;--ok:#12a37a;--bad:#e0475b;--line:#dbe9e6;--sh:0 4px 16px rgba(0,0,0,.07);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1a18;--card:#122421;--ink:#eafaf6;--mut:#92b5ae;--pri:#0f9d8a;--pri2:#2dd4bf;--acc:#ffbf47;--ok:#3fd1a1;--bad:#ff7b8c;--line:#1f3a36;--sh:0 4px 16px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1a18;--card:#122421;--ink:#eafaf6;--mut:#92b5ae;--pri:#0f9d8a;--pri2:#2dd4bf;--acc:#ffbf47;--ok:#3fd1a1;--bad:#ff7b8c;--line:#1f3a36;--sh:0 4px 16px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(900px 380px at 100% -80px,color-mix(in srgb,var(--pri2) 15%,transparent),transparent),var(--bg);color:var(--ink);font-family:'Hind',system-ui,sans-serif;font-size:16px;line-height:1.45;padding-bottom:110px}
h1,h2,.tile b{font-family:'Poppins','Hind',system-ui,sans-serif}
main{padding:0 14px 14px;max-width:640px;margin:0 auto}
.hero{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:24px 18px 26px;border-radius:0 0 28px 28px;margin:0 -14px 14px;box-shadow:0 10px 28px color-mix(in srgb,var(--pri) 35%,transparent);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero>*{position:relative;z-index:1}.hero h1{margin:0;font-size:22px;font-weight:600}.hero p{margin:2px 0 12px;opacity:.85;font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center}
h2{font-size:17px;margin:20px 0 10px;display:flex;align-items:center;gap:8px}h2:before{content:"";width:5px;height:18px;border-radius:9px;background:linear-gradient(var(--pri2),var(--acc))}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh)}
.tile{position:relative;overflow:hidden;padding:16px}.tile:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--pri)}
.grid .tile:nth-child(2):before{background:var(--acc)}.grid .tile:nth-child(3):before{background:var(--ok)}.grid .tile:nth-child(4):before{background:var(--bad)}
.tile b{display:block;font-size:30px;font-weight:700;line-height:1.1;background:linear-gradient(135deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tile b[style]{background:none;color:inherit}
.tile span{color:var(--mut);font-size:14px}
.warn{border:2px solid var(--acc);background:linear-gradient(135deg,var(--card),rgba(255,176,32,.12))}
.card{padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.mut{color:var(--mut);font-size:14px}
input,select,textarea{width:100%;font:inherit;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);margin:4px 0}
input:focus,select:focus,textarea:focus{border-color:var(--pri2)}
button,.btn{font:inherit;font-weight:600;min-height:44px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;transition:transform .12s}
button:active,.btn:active{transform:scale(.96)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));border:0;color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--pri) 35%,transparent)}
.big{width:100%;background:var(--acc);color:#1d1b3a;font-weight:700;border:0;font-size:18px;border-radius:16px;padding:14px;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.p.on{background:var(--ok);color:#fff;border-color:var(--ok)}.a.on{background:var(--bad);color:#fff;border-color:var(--bad)}
.p.on,.a.on{box-shadow:0 4px 10px rgba(0,0,0,.18)}
.wa{background:#1f9d55;color:#fff;border-color:#1f9d55;min-height:38px;font-size:14px}
.chip{font-size:13px;padding:4px 12px;min-height:32px;border:0;border-radius:99px;font-weight:700}
.ok{background:var(--ok);color:#fff}.no{background:var(--acc);color:#14213d}
.gap{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.q{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:6px}
.q button{flex-direction:column;font-size:13px;padding:12px 2px;border-radius:18px;box-shadow:var(--sh)}
.q i{font-style:normal;font-size:22px;background:color-mix(in srgb,var(--pri2) 15%,transparent);width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.plan{border:2px solid var(--pri)}
nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,1fr);border-radius:26px;padding:6px;border:1px solid var(--line);box-shadow:0 10px 30px rgba(20,20,60,.2);backdrop-filter:blur(14px);background:color-mix(in srgb,var(--card) 88%,transparent)}
nav button{border:0;background:none;color:var(--mut);flex-direction:column;font-size:11px;padding:6px 1px;min-height:48px}
nav i{font-style:normal;font-size:20px}
nav button.on{color:var(--pri);background:linear-gradient(135deg,color-mix(in srgb,var(--pri2) 22%,transparent),rgba(255,176,32,.16))}
.empty{text-align:center;color:var(--mut);padding:24px 8px}
.logo{display:inline-flex;line-height:0}.sv{position:sticky;bottom:96px;z-index:5}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{min-height:42px;padding:0;border-radius:10px;font-weight:600}
.day.P{background:var(--ok);color:#fff;border-color:var(--ok)}.day.A{background:var(--bad);color:#fff;border-color:var(--bad)}
.lang{min-height:36px;background:transparent;color:#fff;border-color:#ffffff66;padding:4px 12px}
.av{width:40px;height:40px;border-radius:50%;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-family:'Poppins','Hind',sans-serif;flex:none;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.who{display:flex;align-items:center;gap:10px;min-width:0}.who>div{min-width:0}
.srow{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}.srch{margin:12px 0}
.bar{height:8px;border-radius:99px;background:var(--line);margin:8px 0;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--acc));border-radius:99px}
.tb{width:100%;border-collapse:collapse;font-size:14px}.tb th,.tb td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}.tb th:first-child,.tb td:first-child{text-align:left}
.bt{border:0;background:none;box-shadow:none;padding:2px 0;flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:left}.bt b{font-size:17px}
.edit{background:var(--bg);box-shadow:none;margin:8px 0 0}
.seg{display:flex;gap:4px;background:var(--line);padding:4px;border-radius:16px;margin:0 0 12px}.seg button{flex:1;border:0;background:none;border-radius:12px;color:var(--mut)}.seg button.on{background:var(--card);color:var(--pri);box-shadow:var(--sh)}
[data-a=delb],[data-a=dels],[data-a=dn]{color:var(--bad);border-color:rgba(224,71,91,.35)}
main>*{animation:fi .25s ease}@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){main>*{animation:none}button,.btn{transition:none}}
.trend{display:flex;align-items:flex-end;gap:8px;min-height:110px}.trend>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;font-size:11px;color:var(--mut)}
.trend i{width:100%;max-width:34px;min-height:3px;border-radius:8px 8px 3px 3px;background:linear-gradient(var(--pri2),var(--pri))}.trend b{color:var(--ink);font-size:11px}
.sethero{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 10px 28px color-mix(in srgb,var(--pri) 30%,transparent)}.sethero .mut{color:#ffffffcc}.sethero b{font-size:19px;font-family:'Poppins','Hind',sans-serif}.sethero .av{width:54px;height:54px;font-size:22px;background:#ffffff33!important}
.sec{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);padding:14px;margin-bottom:12px}.sech{display:flex;align-items:center;gap:10px;margin-bottom:10px}.sech i{font-style:normal;font-size:20px;width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--pri2) 15%,transparent)}.sech b{font-family:'Poppins','Hind',sans-serif;font-size:16px}
.fl{display:block;font-size:13px;color:var(--mut);margin-top:8px}
:root[data-acc="indigo"]{--pri:#3b3fb8;--pri2:#6a5cf0}
:root[data-acc="rose"]{--pri:#be185d;--pri2:#f43f5e}
:root[data-acc="amber"]{--pri:#b45309;--pri2:#f59e0b}

/* ---- professional polish ---- */
:root{--sh:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);--bg:#f4f7f7}
body{font-size:15.5px;letter-spacing:.005em}
h2{font-size:15px;font-weight:600;text-transform:none;margin:22px 0 10px;color:var(--ink)}
h2:before{width:3px;height:16px;border-radius:2px;background:var(--pri)}
.card,.tile,.sec{border-radius:14px;box-shadow:var(--sh)}
.card{padding:14px 16px}
button,.btn{border-radius:10px;font-weight:600}
input,select,textarea{border-radius:10px;padding:11px 12px}
.pri{background:var(--pri);box-shadow:none}
.big{background:#fff;color:var(--pri);border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.12);font-size:16px}
.hero{border-radius:0 0 22px 22px;padding:22px 18px 22px;box-shadow:none;background:linear-gradient(135deg,var(--pri),color-mix(in srgb,var(--pri) 78%,#000))}
.hero:after{display:none}
.hero h1{font-size:20px;letter-spacing:-.2px}
.lang{border-radius:8px}
.tile{padding:14px 16px}.tile b{font-size:26px;background:none;color:var(--ink);-webkit-background-clip:initial;background-clip:initial}
.tile:before{width:3px}
.q button{border-radius:14px;box-shadow:var(--sh);font-weight:600}
.q i{border-radius:12px;color:var(--pri);background:color-mix(in srgb,var(--pri) 10%,transparent)}
nav{left:0;right:0;bottom:0;border-radius:0;border-width:1px 0 0;padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 12px rgba(16,24,40,.06);background:var(--card);backdrop-filter:none}
nav i{display:flex;line-height:0}
nav button{font-size:11px;font-weight:600;gap:3px}
nav button.on{background:none;color:var(--pri)}
.chip{border-radius:6px;font-size:12px;letter-spacing:.02em}
.av{box-shadow:none}
.sethero{border-radius:16px;box-shadow:none;background:linear-gradient(135deg,var(--pri),color-mix(in srgb,var(--pri) 78%,#000))}
.sech i{border-radius:10px}
.seg{border-radius:12px}.seg button{border-radius:9px}
.warn{background:var(--card);border:1px solid var(--acc)}
.trend i{border-radius:5px 5px 2px 2px}

/* ---- more accent colours ---- */

@media (prefers-color-scheme:dark){:root:not([data-theme="light"])[data-acc="black"]{--pri:#6b7280;--pri2:#9ca3af}:root:not([data-theme="light"])[data-acc="white"]{--pri:#e2e8f0;--pri2:#cbd5e1}}

.sw.sel{outline:3px solid var(--acc);outline-offset:2px}

/* ---- look styles ---- */
:root[data-style="bright"] body{background:radial-gradient(700px 320px at 100% -60px,color-mix(in srgb,var(--pri2) 30%,transparent),transparent),radial-gradient(600px 300px at -10% 45%,color-mix(in srgb,var(--acc) 15%,transparent),transparent),var(--bg)}

const yCanon=o=>{if(o===null||o===undefined)return undefined;if(Array.isArray(o)){const r=o.map(yCanon).filter(x=>x!==undefined);return r.length?r:undefined}
 if(typeof o==='object'){const r={};let n=0;Object.keys(o).sort().forEach(k=>{const c=yCanon(o[k]);if(c!==undefined){r[k]=c;n++}});return n?r:undefined}return o};
const yFlat=d=>{const m={};['b','s','n','e'].forEach(k=>(d[k]||[]).forEach(x=>{if(x&&x.id){const c=yCanon(k==='s'?Object.assign({},x,{img:undefined}):x);if(c)m[k+'/'+x.id]=JSON.stringify(c)}}));
 Object.keys(d.a||{}).forEach(k=>{const r=d.a[k]||{};Object.keys(r).forEach(s=>{if(r[s]!==undefined&&r[s]!==null)m['a/'+k+'/'+s]=JSON.stringify(r[s])})});

const yFlatR=r=>{const m={};['b','s','n','e'].forEach(k=>Object.keys(r[k]||{}).forEach(id=>{const c=yCanon(r[k][id]);if(c)m[k+'/'+id]=JSON.stringify(c)}));
 Object.keys(r.a||{}).forEach(k=>Object.keys(r.a[k]||{}).forEach(s=>{m['a/'+k+'/'+s]=JSON.stringify(r.a[k][s])}));const ac=yCanon(r.acc);if(ac)m.acc=JSON.stringify(ac);return m};
function yPut(k,r){const p=k.split('/'),o=r===undefined?undefined:JSON.parse(r);

async function ySync(){
 if(!Y)return;if(ys.busy){ys.again=1;return}
 ys.busy=1;ys.err='';let chg=0;
 try{
  const res=await fetch(DBU+'/sync/'+Y.code+'.json',{cache:'no-store'});

   const r2=await fetch(DBU+'/sync/'+Y.code+'.json',{method:'PATCH',body:JSON.stringify(part)});
   if(!r2.ok)throw new Error(yErr(r2.status));
   Object.keys(part).forEach(k=>{if(part[k]===null)delete Y.base[k];else Y.base[k]=JSON.stringify(yCanon(part[k]))})}

const yGen=()=>{const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789',a=new Uint32Array(24);crypto.getRandomValues(a);return Array.from(a,x=>A[x%A.length]).join('')};

const ySt=()=>{if(ys.err)return '⚠️ '+ys.err;if(ys.busy)return 'Syncing…';if(!navigator.onLine)return '📴 Offline. Changes will sync when you are online.';let n=0;try{const L=yFlat(S),B=Y.base||{};Object.keys(L).forEach(k=>{if(L[k]!==B[k])n++});Object.keys(B).forEach(k=>{if(L[k]===undefined)n++})}catch(e){}

async function yKey(ph,pn){const e=new TextEncoder(),k=await crypto.subtle.importKey('raw',e.encode(pn),'PBKDF2',false,['deriveBits']),b=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:e.encode('edudesk-v1|'+ph),iterations:150000},k,256);return Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join('')}

/* ---- Login: same mobile number + PIN on any phone = same synced data ---- */
async function cloudLogin(a,ph,pn,pn2,cn){
 const A=getAcct(),same=!!A&&A.ph===ph,other=!!A&&!same,bad=m=>{msg=m;render()},setA=()=>{try{localStorage.setItem(AK,JSON.stringify({ph:ph,h:mkH(ph,pn)}))}catch(x){}};
 const swap=async()=>{if(!other)return true;if(Y){try{await ySync()}catch(x){}}if(!confirm('This phone currently has data for '+A.ph+'. Switching will replace it on this phone (it stays safe in that account online). Continue?'))return false;S=fresh();try{localStorage.setItem('edk_data',JSON.stringify(S))}catch(x){}return true};
 if(a!=='pin_up'){const w=flWait();if(w)return bad(t('e_wait').replace('{s}',w))}
 if(!(window.crypto&&crypto.subtle))return bad('Please open the app from its https:// link.');
 try{
  if(a==='pin_up'){
   if(same){lm='old';return bad(t('e_exist'))}
   if(pn!==pn2)return bad(t('e_mis'));
   bad('Please wait…');
   const code=await yKey(ph,pn);
   if(await yProbe(code)){lm='old';return bad('This mobile number already has an account. Choose “Existing account” and log in.')}
   if(!await swap())return bad('');
   setA();Y={code,base:{},last:0,mk:1};ySave();yStream();unlock();render();ySync();return}
  if(a==='pin_in'){
   if(same){
    if(A.h!==mkH(ph,pn)){flBad();return bad(t('e_bad'))}
    flOk();unlock();render();
    try{const code=await yKey(ph,pn);if(!Y||Y.code!==code)await yConnect(ph,pn)}catch(x){}
    ySync();return}
   bad('Please wait…');
   const code=await yKey(ph,pn),raw=await yProbe(code);
   if(!raw){flBad();return bad('No account found for this number and PIN. Check them, or choose “New account”.')}
   if(!await swap())return bad('');
   flOk();setA();Y={code,base:null,last:0};ySave();yStream();unlock();render();ySync();return}
  if(!A){lm='new';return bad(t('e_noacc'))}
  if(!same){flBad();return bad(t('e_num'))}
  if(S.acc&&S.acc.centre&&cn.toLowerCase()!==String(S.acc.centre).toLowerCase()){flBad();return bad(t('e_cn'))}
  if(pn!==pn2)return bad(t('e_mis'));
  flOk();setA();unlock();render();
  try{await yConnect(ph,pn)}catch(x){}
  ySync()
 }catch(x){const m=(x&&x.message)||'';bad(/^(Permission|Database|Server)/.test(m)?m:(navigator.onLine?'Could not reach the server ('+((x&&x.name)||'error')+'). Open the app from your own https:// link, not inside Claude, and check your internet.':'Internet is needed for the first login on a new phone.'))}
}
